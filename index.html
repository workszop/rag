  <title>Symulator RAG dla wsparcia technicznego</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23FFD500'/%3E%3Ctext x='16' y='24' font-family='Arial,sans-serif' font-weight='700' font-size='22' text-anchor='middle' fill='%231C1917'%3ER%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    @keyframes boot-reveal { to { visibility: visible; } }

    @media print { html:not(.app-ready) body { visibility: visible; animation: none; } }

  <noscript><style>html:not(.app-ready) body { visibility: visible; animation: none; }</style></noscript>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <style>
/* ============================================================
   edulab - Colors & Type foundation
   Fonts (Outfit, IBM Plex Sans, Roboto Mono) load from Google Fonts
   via the <link> tags in tokens/head.html - paste that into <head>.
   No @import here: it chains requests and blocks rendering.
   ============================================================ */

:root {
  /* ---- Brand fonts ---- */
  --font-display: 'Outfit', 'IBM Plex Sans', system-ui, sans-serif;
  --font-sans:    'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  --font-mono:    'Roboto Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  /* ============================================================
     RAW COLOR TOKENS
     ============================================================ */

  /* Paper - page background is white; the stone steps are bands / wells.
     Warm neutral grey (no yellow cast) so yellow and the colour blocks stay the
     loudest thing on the page. Stone v2 (2026-10-10) replaced the cream sand
     (#FBF7E6 / #F5EDCB), which at 1.07:1 on white did not read as a surface. */
  --paper:    #FFFFFF;   /* page background (white)                       */
  --paper-2:  #F5F3F0;   /* stone band: alternating sections, card heads   */
  --paper-3:  #EAE6E0;   /* deepest stone: wells, table heads, bar tracks  */
  --surface:  #FFFFFF;   /* cards & sheets                                */

  /* Ink - warm near-black text & lines */
  --ink:      #1C1917;   /* primary text                                    */
  --ink-2:    #44403C;   /* secondary text, 10.3:1 on white                 */
  --ink-3:    #625B53;   /* muted / placeholder: >= 4.5:1 on every paper step */
  --line:     #E0DBD3;   /* hairline: dividers, table rows, card heads      */
  --line-2:   #C9C2B7;   /* stronger: card contours, section rules          */
  --line-strong: #857C69;/* control boundaries (inputs, ghost buttons,
                            answer options): >= 3:1 on paper steps (WCAG 1.4.11) */

  /* ---- Brand: Yellow main · Blue + Green secondary · Red danger ----
     Plain saturated colours. The base colour (--blue) is for large fills,
     illustrations and large text (>= 24px, or 19px bold). "-soft" is the
     solid fill for chips and panels that carry small text: it is the
     AA shade (= "-600"), so its "-ink" (white; dark ink on yellow) reaches
     4.5:1. A colour used AS text goes only on white and uses "-600".
     Never colour-on-colour (no green text on green).
     Gate: python3 scripts/check-contrast.py */

  /* Yellow - primary (buttons, progress, values on dark panels) */
  --yellow:      #FFD500;
  --yellow-600:  #F0C800;  /* hover / press          */
  --yellow-soft: #FFD500;  /* chip / panel fill      */
  --yellow-ink:  #1C1917;  /* text on yellow         */

  /* Blue - secondary (panels, chips, correct / selected state) */
  --blue:      #1E8FC2;
  --blue-600:  #177AA8;
  --blue-soft: #177AA8;   /* = blue-600, white text 4.8:1 */
  --blue-ink:  #FFFFFF;

  /* Green - secondary support (chips, success) */
  --green:      #00A651;
  --green-600:  #078342;  /* hover / press, AA text shade */
  --green-soft: #078342;  /* = green-600, white text 4.9:1 */
  --green-ink:  #FFFFFF;

  /* Red - danger / important / wrong (use sparingly) */
  --red:      #E5322D;
  --red-600:  #C92823;
  --red-soft: #C92823;   /* = red-600, white text 5.5:1 */
  --red-ink:  #FFFFFF;

  /* Grape - 5th category tone (colour-coded groups), from the play palette */
  --grape:      #7A5AC2;
  --grape-soft: #7A5AC2;  /* white text 5.2:1 */
  --grape-ink:  #FFFFFF;

  /* Legacy role aliases - older edulab apps use these names */
  --marigold: var(--yellow); --marigold-600: var(--yellow-600); --marigold-soft: var(--yellow-soft); --marigold-ink: var(--yellow-ink);
  --teal:     var(--blue);   --teal-600:     var(--blue-600);   --teal-soft:     var(--blue-soft);   --teal-ink:     var(--blue-ink);
  --sky:      var(--green);                                     --sky-soft:      var(--green-soft);  --sky-ink:      var(--green-ink);
  --coral:    var(--red);    --coral-600:    var(--red-600);    --coral-soft:    var(--red-soft);    --coral-ink:    var(--red-ink);

  /* Play palette - subject/category colours in the kids app */
  --play-sun:    #FFD500;
  --play-grass:  #00A651;
  --play-berry:  #C6478B;
  --play-grape:  #7A5AC2;
  --play-sky:    #1E8FC2;
  --play-coral:  #E5322D;

  /* ---- Semantic ---- */
  --success:      #00A651;  --success-soft: #078342;  --success-ink: #FFFFFF;
  --warning:      #FFD500;  --warning-soft: #FFD500;  --warning-ink: #1C1917;
  --danger:       #E5322D;  --danger-soft:  #C92823;  --danger-ink:  #FFFFFF;
  --info:         #1E8FC2;  --info-soft:    #177AA8;  --info-ink:    #FFFFFF;

  /* ---- Functional aliases ---- */
  --bg:        var(--paper);
  --fg:        var(--ink);
  --fg-muted:  var(--ink-2);
  --primary:   var(--yellow);
  --on-primary:#1C1917;      /* dark text on yellow */
  /* White gap + ink band: >= 3:1 on paper, sand, yellow and every chip fill.
     Pair with `outline: 3px solid transparent` so forced-colours mode still shows focus. */
  --focus-ring: 0 0 0 2px var(--paper), 0 0 0 5px var(--ink);
  /* Range-slider track */
  --track: color-mix(in srgb, var(--ink) 24%, transparent);

  /* ============================================================
     SPACING  (4pt base)
     ============================================================ */
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;
  --sp-12: 48px; --sp-16: 64px; --sp-20: 80px; --sp-24: 96px;

  /* ---- Radii (friendly, generous) ---- */
  --r-xs: 6px; --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 28px; --r-pill: 999px;

  /* ---- Elevation - warm, low, soft ---- */
  --shadow-sm: 0 1px 2px rgba(33,30,26,.10), 0 2px 6px rgba(33,30,26,.06);
  --shadow-md: 0 6px 18px rgba(33,30,26,.12), 0 1px 3px rgba(33,30,26,.08);
  --shadow-lg: 0 16px 40px rgba(33,30,26,.12), 0 3px 8px rgba(33,30,26,.06);
  --shadow-primary:  0 8px 22px color-mix(in srgb, var(--yellow) 30%, transparent);
  --shadow-marigold: var(--shadow-primary);   /* legacy alias */

  /* ============================================================
     TYPE SCALE (semantic sizes)
     ============================================================ */
  --display-font:  clamp(48px, 6vw, 72px);
  --h1: 44px; --h2: 33px; --h3: 25px; --h4: 19px;
  --body-lg: 18px; --body: 16px; --body-sm: 14px;
  --caption: 13px; --overline: 12px;
}

/* ============================================================
   SEMANTIC ELEMENT STYLES
   Apply via element selectors or .edu-prose wrapper.
   Element defaults are wrapped in :where(.edu) (zero specificity) so any
   single class wins: <p class="edu-overline">, <p class="edu-small">,
   <h1 class="app-title"> keep their own font/size instead of the element default.
   ============================================================ */

.edu-display, :where(.edu) h1.display {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: var(--display-font);
  line-height: 1.02;
  letter-spacing: -0.025em;
  color: var(--ink);
}
:where(.edu) h1, .edu-h1 {
  font-family: var(--font-display);
  font-weight: 700; font-size: var(--h1);
  line-height: 1.06; letter-spacing: -0.02em; color: var(--ink);
}
:where(.edu) h2, .edu-h2 {
  font-family: var(--font-display);
  font-weight: 700; font-size: var(--h2);
  line-height: 1.12; letter-spacing: -0.015em; color: var(--ink);
}
:where(.edu) h3, .edu-h3 {
  font-family: var(--font-display);
  font-weight: 700; font-size: var(--h3);
  line-height: 1.2; letter-spacing: -0.01em; color: var(--ink);
}
:where(.edu) h4, .edu-h4 {
  font-family: var(--font-sans);
  font-weight: 700; font-size: var(--h4);
  line-height: 1.3; color: var(--ink);
}
:where(.edu) p, .edu-p, .edu-body {
  font-family: var(--font-sans);
  font-weight: 400; font-size: var(--body);
  line-height: 1.6; color: var(--ink-2);
}
.edu-body-lg { font-family: var(--font-sans); font-size: var(--body-lg); line-height: 1.6; color: var(--ink-2); }
.edu-small  { font-family: var(--font-sans); font-size: var(--body-sm); line-height: 1.5; color: var(--ink-2); }
.edu-caption{ font-family: var(--font-sans); font-size: var(--caption); line-height: 1.45; color: var(--ink-3); }

/* Overline - mono, tracked; functional labels only (never above page/section titles) */
.edu-overline {
  font-family: var(--font-mono);
  font-weight: 500; font-size: var(--overline);
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ink);
}
:where(.edu) code, .edu-mono {
  font-family: var(--font-mono);
  font-size: 0.92em; color: var(--ink);
  background: var(--paper-3); padding: 0.12em 0.4em; border-radius: var(--r-xs);
}

/* Solid colour blocks (callouts, stat cards, chips): set background: var(--X-soft) and
   color: var(--X-ink) on the block, add .edu-block, and every heading/paragraph inside
   inherits that text colour instead of the default ink. */
.edu-block, .edu-block h1, .edu-block h2, .edu-block h3, .edu-block h4, .edu-block p,
.edu-block li, .edu-block small { color: inherit; }

body.edu { background: var(--paper); color: var(--ink); font-family: var(--font-sans); }
  </style>
  <style>
    /* ─── Base ─── */
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; }
    :focus-visible { outline: 3px solid transparent; outline-offset: 2px; box-shadow: var(--focus-ring); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    [hidden] { display: none !important; }

    /* ─── Top menu ─── */
    .edu-header { position: sticky; top: 0; z-index: 50; width: 100%; background: var(--paper); border-bottom: 1px solid var(--line-2); }
    .edu-header-inner { max-width: 1100px; margin: 0 auto; padding: 8px 30px; display: flex; align-items: center; gap: 12px; }
    .edu-logo { width: 64px; height: 64px; display: block; margin-right: -6px; }
    .edu-wordmark { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: -.02em; color: var(--ink); }
    .edu-header-inner .edu-seg { margin-left: auto; }
    .edu-seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--paper-2); border-radius: var(--r-pill); }
    .edu-seg button { border: none; background: transparent; padding: 7px 14px; border-radius: var(--r-pill); font-family: var(--font-sans); font-weight: 600; color: var(--ink-2); cursor: pointer; transition: background-color .15s; }
    .edu-seg button:hover { background: var(--paper-3); }
    .edu-seg button.active { background: var(--yellow); color: var(--yellow-ink); }

    /* ─── Page head ─── */
    .page-head { max-width: 1100px; margin: 0 auto; padding: 44px 30px 52px; text-align: left; }
    .app-title { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.3rem, 5vw, 3.3rem); letter-spacing: -.025em; line-height: 1.05; color: var(--ink); margin: 0 0 14px; }
    .edu-lead { font-size: 1.15rem; line-height: 1.6; color: var(--ink-2); margin: 0; }

    /* ─── Section bands ─── */
    .sec { margin: 0; padding: 52px 0 60px; border-top: 1px solid var(--line); }
    .sec:nth-of-type(odd) { background: var(--paper-2); }
    .sec > .wrap { max-width: 1100px; margin: 0 auto; padding: 0 30px; }
    .sec-head { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
    .sec-head h2 { margin: 0; }
    .sec-head::after { content: ""; flex: 1; height: 1px; background: var(--line-2); }

    /* ─── Tones & badges ─── */
    .tone-grape  { background: var(--grape-soft);  color: var(--grape-ink); }
    .tone-blue   { background: var(--blue-soft);   color: var(--blue-ink); }
    .tone-yellow { background: var(--yellow-soft); color: var(--yellow-ink); }
    .tone-green  { background: var(--green-soft);  color: var(--green-ink); }
    .tone-ink    { background: var(--ink);         color: var(--paper); }
    .tone-stone  { background: var(--paper-3);     color: var(--ink); }
    .ic { width: 18px; height: 18px; flex: none; }
    .badge { flex: none; width: 34px; height: 34px; border-radius: var(--r-sm); display: inline-grid; place-items: center; }
    .badge-lg { width: 46px; height: 46px; border-radius: var(--r-md); }
    .badge-lg .ic { width: 24px; height: 24px; }
    .badge.tone-ink { color: var(--yellow); }
    .tile-h { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .tile-h h3 { margin: 0; font-size: 18px; line-height: 1.3; }

    /* ─── Cards ─── */
    .card { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); overflow: hidden; display: flex; flex-direction: column; min-width: 0; transition: box-shadow .2s, border-color .2s; }
    .card-head { padding: 14px 22px; background: var(--paper-2); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .card-body { padding: 20px 22px; flex: 1; min-width: 0; }
    .card-foot { padding: 14px 22px; border-top: 1px dashed var(--line-2); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .card-foot p { margin: 0; font-size: var(--body-sm); }

    /* ─── Chips ─── */
    .edu-chip { font-family: var(--font-mono); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; padding: 4px 10px; border-radius: var(--r-pill); white-space: nowrap; }
    .chip-stone  { background: var(--paper-3); color: var(--ink); }
    .chip-yellow { background: var(--yellow-soft); color: var(--yellow-ink); }
    .chip-green  { background: var(--green-soft); color: var(--green-ink); }
    .chip-blue   { background: var(--blue-soft); color: var(--blue-ink); }

    /* ─── Controls ─── */
    .field-label { display: block; margin: 0 0 8px; font-family: var(--font-mono); font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .1em; color: var(--ink); }
    .query-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .input { flex: 1 1 320px; min-width: 0; padding: 11px 14px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); font: inherit; font-size: var(--body); background: var(--surface); color: var(--ink); }
    .input::placeholder { color: var(--ink-3); }
    .input[readonly] { background: var(--paper-2); }
    .edu-btn, .btn-ghost { display: inline-flex; align-items: center; gap: 8px; border-radius: var(--r-pill); padding: 11px 20px; font-family: var(--font-display); font-weight: 600; font-size: 16px; cursor: pointer; transition: background-color .15s, transform .12s cubic-bezier(.32,.72,.32,1); }
    .edu-btn { background: var(--yellow); color: var(--on-primary); border: 1px solid var(--yellow); box-shadow: var(--shadow-primary); }
    .edu-btn:hover { background: var(--yellow-600); }
    .btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--line-strong); }
    .btn-ghost:hover { background: var(--paper-2); }
    .edu-btn:active, .btn-ghost:active { transform: scale(.96); }
    .edu-btn:disabled, .btn-ghost:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .samples { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
    .sample { border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); border-radius: var(--r-pill); padding: 7px 14px; font-family: var(--font-sans); font-size: var(--body-sm); cursor: pointer; text-align: left; transition: background-color .15s; }
    .sample:hover { background: var(--paper-2); }
    .sample[aria-pressed="true"] { background: var(--blue-soft); border-color: var(--blue-soft); color: var(--blue-ink); }
    kbd { font-family: var(--font-mono); font-size: 11px; border: 1px solid var(--line-strong); border-radius: var(--r-xs); padding: 1px 6px; background: var(--surface); color: var(--ink); }
    .shortcuts { color: var(--ink-2); font-size: var(--caption); display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }

    /* ─── Progress ─── */
    .progress { display: flex; align-items: center; gap: 14px; flex: 1 1 320px; }
    .progress-label { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink); white-space: nowrap; }
    .progress-bar { flex: 1; min-width: 80px; height: 10px; background: var(--paper-3); border-radius: var(--r-pill); overflow: hidden; }
    .progress-bar span { display: block; height: 100%; background: var(--yellow); border-radius: var(--r-pill); transition: width .3s; }
    .progress-status { font-size: var(--body-sm); color: var(--ink-2); }

    /* ─── RAG flow ─── */
    .flow-row { display: grid; grid-template-columns: 1fr 32px 1fr 32px 1fr; align-items: stretch; }
    .flow-arrow { display: grid; place-items: center; color: var(--ink-3); }
    .flow-down { display: grid; place-items: center; color: var(--ink-3); padding: 10px 0; }
    .stage[data-state="active"] { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink), var(--shadow-md); }
    .stage .card-body { min-height: 190px; }
    .scroll { max-height: 260px; overflow-y: auto; }
    .waiting { margin: 0; color: var(--ink-3); font-style: italic; font-size: var(--body-sm); }
    .well { background: var(--paper-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px 14px; color: var(--ink); overflow-wrap: anywhere; }
    .raw-vec { margin: 12px 0 0; font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); overflow-wrap: anywhere; }
    .card-body .edu-overline { margin: 0 0 10px; }

    .kb-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .kb-doc { border: 1px solid var(--line-2); border-radius: var(--r-sm); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .kb-doc[data-hit="true"] { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
    .kb-doc-top { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
    .kb-doc-title { font-size: 13px; font-weight: 600; color: var(--ink); line-height: 1.35; display: flex; gap: 6px; align-items: flex-start; }
    .kb-doc-title .ic { width: 16px; height: 16px; margin-top: 1px; }
    .kb-doc-vec { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); }

    .vec { display: grid; gap: 7px; }
    .vec-row { display: grid; grid-template-columns: 84px 1fr 44px; gap: 8px; align-items: center; font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); }
    .vec-row .val { text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; }
    .track { height: 8px; background: var(--paper-3); border-radius: var(--r-pill); overflow: hidden; }
    .track span { display: block; height: 100%; background: var(--ink); border-radius: var(--r-pill); }

    .hits { display: grid; gap: 8px; }
    .hit { border: 1px solid var(--line-2); border-radius: var(--r-sm); padding: 10px 12px; display: grid; gap: 6px; }
    .hit-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-family: var(--font-mono); font-size: 12px; color: var(--ink); }
    .hit-top span { display: inline-flex; align-items: center; gap: 6px; }
    .hit-title { font-size: 13px; color: var(--ink-2); line-height: 1.35; }
    .hit-meta { margin: 0 0 10px; font-size: var(--body-sm); color: var(--ink-2); }

    .answer { margin: 0; white-space: pre-wrap; color: var(--ink); font-size: var(--body); line-height: 1.6; }
    .sources { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .prompt-grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 16px; }
    .msg { border: 1px solid var(--line-2); border-radius: var(--r-md); overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
    .msg-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px; background: var(--paper-3); border-bottom: 1px solid var(--line-2); }
    .msg-head .edu-overline { margin: 0; }
    .msg-text { margin: 0; padding: 14px; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.6; color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 340px; overflow-y: auto; flex: 1; }
    .msg .waiting { padding: 14px; }
    .note-block { border-radius: var(--r-md); padding: 16px 20px; display: flex; gap: 12px; align-items: flex-start; }
    .note-block p { margin: 0; }

    /* ─── Documents ─── */
    .doc-tools { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
    .doc-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .doc-grid .card-body p { margin: 0; font-size: var(--body-sm); }
    .doc-grid .card-foot { display: block; }
    .chev { transition: transform .2s; }
    [aria-expanded="false"] .chev { transform: rotate(-90deg); }

    /* ─── How it works ─── */
    .tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; margin-bottom: 20px; }
    .tiles .card-body p { margin: 0; font-size: var(--body-sm); }

    /* ─── Responsive ─── */
    @media (max-width: 1080px) {
      .kb-grid { grid-template-columns: repeat(2, 1fr); }
      .tiles { grid-template-columns: repeat(2, 1fr); }
      .prompt-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 768px) {
      .edu-header-inner { padding: 6px 16px; }
      .edu-logo { width: 48px; height: 48px; }
      .page-head { padding: 28px 16px 36px; }
      .sec { padding: 36px 0 44px; } .sec > .wrap { padding: 0 16px; }
      .sec-head { flex-wrap: wrap; }
      .sec-head h2 { flex: 1; min-width: 0; font-size: 26px; }
      .sec-head::after { flex: 1 0 100%; }
      .flow-row { grid-template-columns: 1fr; }
      .flow-arrow { padding: 10px 0; transform: rotate(90deg); }
      .kb-grid, .doc-grid, .tiles { grid-template-columns: 1fr; }
      .card-head, .card-body, .card-foot { padding-left: 16px; padding-right: 16px; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>

        secDocs: 'Knowledge base documents',

        secHow: 'How this RAG system works',
        how1Title: 'Document indexing',
        how1: 'The system embeds the support documents with the same vectoriser it uses for user queries and stores them in a vector database.',

        liveRetrieved: 'Documents retrieved: {n}.',
        liveAnswered: 'Answer generated.',
        liveReset: 'Simulation reset.',
      },
    };

    // ─── State ───
    const savedLang = localStorage.getItem(LANG_KEY);
    const state = {
      lang: LANGS.includes(savedLang) ? savedLang : 'pl',
      step: 0,             // 0..4 = stage about to run, 5 = finished
      running: false,
      query: '',
      docVectors: null,    // { [docId]: number[] } once indexed
      queryVector: null,
      scores: [],          // every doc with its similarity, sorted desc
      retrieved: [],       // docs above MIN_SIMILARITY, top K
      promptBuilt: false,
      answer: null,        // { kind: 'none' } | { kind: 'template', id, docIds } | { kind: 'combine', docIds }
      docsOpen: true,
    };
    state.query = SAMPLES[state.lang][0];

    // ─── DOM refs ───
    const $ = id => document.getElementById(id);
    const queryInput = $('queryInput');
    const runButton = $('runButton');
    const nextButton = $('nextButton');
    const nextLabel = $('nextLabel');
    const resetButton = $('resetButton');
    const samplesEl = $('samples');
    const progressLabel = $('progressLabel');
    const progressBar = $('progressBar');
    const progressFill = $('progressFill');
    const progressStatus = $('progressStatus');
    const shortcutsEl = $('shortcuts');
    const liveEl = $('live');
    const kbBody = $('kbBody');
    const kbStatus = $('kbStatus');
    const queryBody = $('queryBody');
    const embedBody = $('embedBody');
    const retrieveBody = $('retrieveBody');
    const retrieveFoot = $('retrieveFoot');
    const systemPromptText = $('systemPromptText');
    const userPromptChip = $('userPromptChip');
    const userPromptBody = $('userPromptBody');
    const promptStats = $('promptStats');
    const answerBody = $('answerBody');
    const answerSources = $('answerSources');
    const embedDocsButton = $('embedDocsButton');
    const toggleDocsButton = $('toggleDocsButton');
    const toggleDocsLabel = $('toggleDocsLabel');
    const docGrid = $('docGrid');
    const stageEls = [...document.querySelectorAll('.stage')];
    const langButtons = [...document.querySelectorAll('.edu-seg button')];

    // ─── Helpers ───
    function t(key, vars) {
      let s = T[state.lang][key] ?? T.en[key] ?? key;
      if (vars && typeof s === 'string') Object.entries(vars).forEach(([k, v]) => { s = s.replaceAll('{' + k + '}', v); });
      return s;
    }
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const icon = (name, cls = 'ic') => `<i data-lucide="${name}" class="${cls}" aria-hidden="true"></i>`;
    const fmt = v => v.toFixed(3);
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    const docById = id => DOCS.find(d => d.id === id);

    function embed(text) {
      const lower = text.toLowerCase();
      const v = [0, 0, 0, 0];
      FEATURES.forEach(f => { if (f.rx.test(lower)) f.weights.forEach((w, i) => { v[i] += w; }); });
      const sum = v.reduce((a, b) => a + b, 0);
      return sum ? v.map(x => x / sum) : v;
    }

    function cosine(a, b) {
      let dot = 0, ma = 0, mb = 0;
      for (let i = 0; i < a.length; i++) { dot += a[i] * b[i]; ma += a[i] * a[i]; mb += b[i] * b[i]; }
      return ma && mb ? dot / (Math.sqrt(ma) * Math.sqrt(mb)) : 0;
    }

    function indexDocs() {
      // Index the English source text; the Polish translation maps to the same vector.
      state.docVectors = Object.fromEntries(DOCS.map(d => [d.id, embed(d.text.en)]));
    }

    function retrieveDocs() {
      state.scores = DOCS
        .map(d => ({ id: d.id, similarity: cosine(state.queryVector, state.docVectors[d.id]) }))
        .sort((a, b) => b.similarity - a.similarity);
      state.retrieved = state.scores.filter(s => s.similarity >= MIN_SIMILARITY).slice(0, TOP_K);
    }

    function generateAnswer() {
      if (!state.retrieved.length) return { kind: 'none' };
      const q = state.query.toLowerCase();
      const hitIds = state.retrieved.map(r => r.id);
      const tpl = TEMPLATES.find(x => x.test(q) && hitIds.includes(x.docId));
      if (tpl) return { kind: 'template', id: tpl.id, docIds: [tpl.docId] };
      return { kind: 'combine', docIds: hitIds };
    }

    // User message sent to the model: retrieved documents as context, then the question
    function buildUserPrompt() {
      const context = state.retrieved.length
        ? state.retrieved.map(r => {
            const d = docById(r.id);
            return `[${t('docShort')} ${d.id}] ${d.title[state.lang]} (${t('promptSimilarity')} ${r.similarity.toFixed(2)})\n${d.text[state.lang]}`;
          }).join('\n\n')
        : t('promptNoContext');
      return `${t('promptContext')}:\n${context}\n\n${t('promptQuestion')}:\n${state.query.trim() || t('emptyQuery')}`;
    }

    function clearPipeline() {
      state.queryVector = null;
      state.scores = [];
      state.retrieved = [];
      state.promptBuilt = false;
      state.answer = null;
    }

    // The query changed: drop everything computed from the old one
    function invalidateQuery() {
      clearPipeline();
      if (state.step > 1) state.step = 1;
    }

    function announce(key, vars) { liveEl.textContent = t(key, vars); }

    const STEP_ACTIONS = [
      () => { indexDocs(); announce('liveIndexed', { n: DOCS.length }); },
      () => announce('liveQuery'),
      () => { state.queryVector = embed(state.query); announce('liveEmbedded'); },
      () => { retrieveDocs(); announce('liveRetrieved', { n: state.retrieved.length }); },
      () => { state.promptBuilt = true; announce('livePrompt', { n: state.retrieved.length }); },
      () => { state.answer = generateAnswer(); announce('liveAnswered'); },
    ];

    function advance() {
      if (state.running) return;
      if (state.step === STEP_COUNT) { resetSimulation(); return; }
      STEP_ACTIONS[state.step]();
      state.step++;
      render();
    }

    async function runSimulation() {
      if (state.running) return;
      state.running = true;
      clearPipeline();
      state.step = 0;
      render();
      for (let i = 0; i < STEP_COUNT; i++) {
        await sleep(RUN_DELAYS_MS[i]);
        STEP_ACTIONS[i]();
        state.step = i + 1;
        render();
      }
      state.running = false;
      render();
    }

    function resetSimulation() {
      if (state.running) return;
      clearPipeline();
      state.step = 0;
      announce('liveReset');
      render();
    }

    function setQuery(q) {
      if (state.running) return;
      state.query = q;
      if (queryInput.value !== q) queryInput.value = q;
      invalidateQuery();
      render();
    }

    function setLang(lang) {
      if (lang === state.lang) return;
      const sampleIdx = SAMPLES[state.lang].indexOf(state.query);
      state.lang = lang;
      localStorage.setItem(LANG_KEY, lang);
      if (sampleIdx >= 0 && !state.running) {
        state.query = SAMPLES[lang][sampleIdx];
        queryInput.value = state.query;
        invalidateQuery();
      }
      applyStaticText();
      render();
    }

    function toggleDocs() {
      state.docsOpen = !state.docsOpen;
      render();
    }

    // ─── Render ───
    function applyStaticText() {
      document.documentElement.lang = state.lang;
      document.title = t('pageTitle');
      document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
      document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
      shortcutsEl.innerHTML = `<span>${esc(t('shortcutsLabel'))}</span>` +
        [['Enter', 'kRun'], ['N', 'kNext'], ['R', 'kReset'], ['D', 'kDocs'], ['L', 'kLang']]
          .map(([k, label]) => `<span><kbd>${k}</kbd> ${esc(t(label))}</span>`).join('');
    }

    function vectorBars(v) {
      const dims = t('dims');
      return `<div class="vec">${v.map((x, i) =>
        `<div class="vec-row"><span>${esc(dims[i])}</span><span class="track"><span style="width:${(x * 100).toFixed(1)}%"></span></span><span class="val">${x.toFixed(2)}</span></div>`
      ).join('')}</div>`;
    }

    const rawVector = v => `[${v.map(fmt).join(', ')}]`;

    function renderControls() {
      document.body.dataset.step = state.step;
      document.body.dataset.running = state.running;
      document.body.dataset.indexed = !!state.docVectors;
      document.body.dataset.lang = state.lang;
      langButtons.forEach(b => {
        const on = b.dataset.lang === state.lang;
        b.classList.toggle('active', on);
        b.setAttribute('aria-pressed', on);
      });
      queryInput.readOnly = state.running;
      runButton.disabled = state.running;
      nextButton.disabled = state.running;
      resetButton.disabled = state.running;
      embedDocsButton.disabled = state.running;
      nextLabel.textContent = state.step === STEP_COUNT ? t('restart') : t('next');

      samplesEl.innerHTML = SAMPLES[state.lang].map((q, i) =>
        `<button type="button" class="sample" data-sample="${i}" aria-pressed="${q === state.query}"${state.running ? ' disabled' : ''}>${esc(q)}</button>`
      ).join('');

      progressLabel.textContent = `${t('stepWord')} ${state.step}/${STEP_COUNT}`;
      progressFill.style.width = (state.step / STEP_COUNT * 100) + '%';
      progressBar.setAttribute('aria-valuemax', STEP_COUNT);
      progressBar.setAttribute('aria-valuenow', state.step);
      progressStatus.textContent = state.step < STEP_COUNT ? `${t('nextUp')}: ${t('stage' + state.step)}` : t('finished');
    }

    function renderStages() {
      stageEls.forEach(el => {
        const i = Number(el.dataset.stage);
        const s = i < state.step ? 'done' : i === state.step ? 'active' : 'idle';
        el.dataset.state = s;
        const chip = el.querySelector('[data-chip]');
        chip.className = 'edu-chip ' + { idle: 'chip-stone', active: 'chip-yellow', done: 'chip-green' }[s];
        chip.textContent = t({ idle: 'chipIdle', active: 'chipActive', done: 'chipDone' }[s]);
      });

      // Knowledge base
      const hitRank = Object.fromEntries(state.retrieved.map((r, i) => [r.id, i + 1]));
      kbStatus.textContent = state.docVectors ? `${DOCS.length} · ${t('kbIndexed')}` : t('kbNotIndexed');
      kbBody.innerHTML = `<div class="kb-grid">${DOCS.map(d => `
        <div class="kb-doc" data-doc-id="${d.id}" data-hit="${!!hitRank[d.id]}">
          <div class="kb-doc-top">
            <span class="kb-doc-title">${icon(PRODUCT_ICONS[d.product])}<span>${esc(d.title[state.lang])}</span></span>
            ${hitRank[d.id] ? `<span class="edu-chip chip-yellow">#${hitRank[d.id]}</span>` : ''}
          </div>
          <span class="kb-doc-vec">${state.docVectors ? rawVector(state.docVectors[d.id]) : esc(t('notIndexed'))}</span>
        </div>`).join('')}</div>`;

      // Query
      queryBody.innerHTML = `<div class="well"></div>`;
      queryBody.firstChild.textContent = state.query.trim() ? state.query : t('emptyQuery');

      // Embedding
      embedBody.innerHTML = state.queryVector
        ? `<p class="edu-overline">${esc(t('queryVector'))}</p>${vectorBars(state.queryVector)}<p class="raw-vec">${rawVector(state.queryVector)}</p>`
        : `<p class="waiting">${esc(t('waitEmbed'))}</p>`;

      // Retriever
      retrieveFoot.textContent = t('retrieveFoot', { min: MIN_SIMILARITY.toFixed(2), k: TOP_K });
      if (!state.scores.length) {
        retrieveBody.innerHTML = `<p class="waiting">${esc(t('waitRetrieve'))}</p>`;
      } else {
        const above = state.scores.filter(s => s.similarity >= MIN_SIMILARITY).length;
        const meta = `<p class="hit-meta">${esc(t('hitsMeta', { n: above, total: DOCS.length, min: MIN_SIMILARITY.toFixed(2) }))}</p>`;
        retrieveBody.innerHTML = meta + (state.retrieved.length
          ? `<div class="hits scroll">${state.retrieved.map(r => {
              const d = docById(r.id);
              return `<div class="hit" data-doc-id="${d.id}" data-similarity="${r.similarity.toFixed(4)}">
                <div class="hit-top"><span>${icon(PRODUCT_ICONS[d.product])}${esc(t('docShort'))} ${d.id}</span><span>${(r.similarity * 100).toFixed(1)}%</span></div>
                <span class="track"><span style="width:${(r.similarity * 100).toFixed(1)}%"></span></span>
                <span class="hit-title">${esc(d.title[state.lang])}</span>
              </div>`;
            }).join('')}</div>`
          : `<p class="waiting">${esc(t('noHits'))}</p>`);
      }

      // Prompt builder
      systemPromptText.textContent = t('systemPrompt');
      document.body.dataset.promptBuilt = state.promptBuilt;
      if (state.promptBuilt) {
        const userPrompt = buildUserPrompt();
        const tokens = Math.ceil((t('systemPrompt').length + userPrompt.length) / CHARS_PER_TOKEN);
        userPromptChip.textContent = t('promptDocsChip', { n: state.retrieved.length });
        userPromptChip.hidden = false;
        userPromptBody.innerHTML = `<p class="msg-text" id="userPromptText"></p>`;
        userPromptBody.firstChild.textContent = userPrompt;
        userPromptBody.dataset.promptDocs = state.retrieved.map(r => r.id).join(',');
        promptStats.textContent = t('promptStats', { tokens });
        promptStats.hidden = false;
      } else {
        userPromptChip.hidden = true;
        userPromptBody.innerHTML = `<p class="waiting">${esc(t('waitPrompt'))}</p>`;
        userPromptBody.dataset.promptDocs = '';
        promptStats.hidden = true;
      }

      // Answer
      const a = state.answer;
      answerBody.dataset.answerKind = a ? a.kind : 'pending';
      answerSources.innerHTML = '';
      if (!a) {
        answerBody.innerHTML = `<p class="waiting">${esc(t('waitAnswer'))}</p>`;
      } else if (a.kind === 'none') {
        answerBody.innerHTML = `<div class="note-block tone-blue edu-block">${icon('info')}<p>${esc(t('none'))}</p></div>`;
      } else {
        const text = a.kind === 'template'
          ? t(a.id)
          : [t('combineIntro'), ...a.docIds.map(id => { const d = docById(id); return `${d.title[state.lang]}:\n${d.text[state.lang]}`; })].join('\n\n');
        answerBody.innerHTML = `<p class="answer scroll"></p>`;
        answerBody.firstChild.textContent = text;
        answerSources.innerHTML = `<span class="progress-status">${esc(t('sources'))}</span>` +
          a.docIds.map(id => `<span class="edu-chip chip-blue">${esc(t('docShort'))} ${id}</span>`).join('');
      }
    }

    function renderDocs() {
      toggleDocsButton.setAttribute('aria-expanded', state.docsOpen);
      toggleDocsLabel.textContent = state.docsOpen ? t('hideDocs') : t('showDocs');
      docGrid.hidden = !state.docsOpen;
      docGrid.innerHTML = DOCS.map(d => `
        <div class="card" data-doc-id="${d.id}">
          <div class="card-head">
            <span class="tile-h"><span class="badge tone-ink">${icon(PRODUCT_ICONS[d.product])}</span><h3>${esc(d.title[state.lang])}</h3></span>
            <span class="edu-chip chip-stone">${esc(t('categories')[d.category])}</span>
          </div>
          <div class="card-body"><p lang="${state.lang}">${esc(d.text[state.lang])}</p></div>
          <div class="card-foot">
            <p class="edu-overline" style="margin-bottom: 10px;">${esc(t('vector'))}</p>
            ${state.docVectors ? vectorBars(state.docVectors[d.id]) : `<p class="waiting">${esc(t('notIndexed'))}</p>`}
          </div>
        </div>`).join('');
    }

    function render() {
      renderControls();
      renderStages();
      renderDocs();
      if (window.lucide) lucide.createIcons();
    }

    // ─── Listeners ───
    runButton.addEventListener('click', runSimulation);
    nextButton.addEventListener('click', advance);
    resetButton.addEventListener('click', resetSimulation);
    queryInput.addEventListener('input', e => setQuery(e.target.value));
    queryInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); runSimulation(); }
    });
    samplesEl.addEventListener('click', e => {
      const btn = e.target.closest('[data-sample]');
      if (btn) setQuery(SAMPLES[state.lang][Number(btn.dataset.sample)]);
    });
    langButtons.forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
    embedDocsButton.addEventListener('click', () => {
      if (state.running) return;
      indexDocs();
      announce('liveIndexed', { n: DOCS.length });
      render();
    });
    toggleDocsButton.addEventListener('click', toggleDocs);
    document.addEventListener('keydown', e => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.target.closest('input, textarea, select, [contenteditable]')) return;
      const key = e.key.toLowerCase();
      if (key === 'n' || key === 'arrowright') { e.preventDefault(); advance(); }
      else if (key === 'r') resetSimulation();
      else if (key === 'd') toggleDocs();
      else if (key === 'l') setLang(state.lang === 'pl' ? 'en' : 'pl');
    });

    // ─── Init ───
    queryInput.value = state.query;
    applyStaticText();
    render();

    // ─── Reveal ───
    const FONT_WAIT_MS = 1500;
    const BRAND_FONTS = ['400 1em Outfit', '700 1em Outfit', '400 1em "IBM Plex Sans"', '600 1em "IBM Plex Sans"', '400 1em "Roboto Mono"'];
    Promise.race([
      Promise.all(BRAND_FONTS.map(f => document.fonts.load(f).catch(() => null))),
      new Promise(r => setTimeout(r, FONT_WAIT_MS)),
    ]).then(() => document.documentElement.classList.add('app-ready'));
  </script>
</body>
</html>
