  <style>
/* ============================================================
   edulab - Colors & Type foundation
   Fonts (Outfit, IBM Plex Sans, Roboto Mono) load from Google Fonts
   via the <link> tags in tokens/head.html - paste that into <head>.
   No @import here: it chains requests and blocks rendering.
   ============================================================ */

:root {
  /* ---- Brand fonts ---- */
  --font-display: 'Outfit', 'IBM Plex Sans', system-ui, sans-serif;
  --font-sans:    'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  --font-mono:    'Roboto Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  /* ============================================================
     RAW COLOR TOKENS
     ============================================================ */

  /* Paper - page background is white; the stone steps are bands / wells.
     Warm neutral grey (no yellow cast) so yellow and the colour blocks stay the
     loudest thing on the page. Stone v2 (2026-10-10) replaced the cream sand
     (#FBF7E6 / #F5EDCB), which at 1.07:1 on white did not read as a surface. */
  --paper:    #FFFFFF;   /* page background (white)                       */
  --paper-2:  #F5F3F0;   /* stone band: alternating sections, card heads   */
  --paper-3:  #EAE6E0;   /* deepest stone: wells, table heads, bar tracks  */
  --surface:  #FFFFFF;   /* cards & sheets                                */

  /* Ink - warm near-black text & lines */
  --ink:      #1C1917;   /* primary text                                    */
  --ink-2:    #44403C;   /* secondary text, 10.3:1 on white                 */
  --ink-3:    #625B53;   /* muted / placeholder: >= 4.5:1 on every paper step */
  --line:     #E0DBD3;   /* hairline: dividers, table rows, card heads      */
  --line-2:   #C9C2B7;   /* stronger: card contours, section rules          */
  --line-strong: #857C69;/* control boundaries (inputs, ghost buttons,
                            answer options): >= 3:1 on paper steps (WCAG 1.4.11) */

  /* ---- Brand: Yellow main · Blue + Green secondary · Red danger ----
     Plain saturated colours. The base colour (--blue) is for large fills,
     illustrations and large text (>= 24px, or 19px bold). "-soft" is the
     solid fill for chips and panels that carry small text: it is the
     AA shade (= "-600"), so its "-ink" (white; dark ink on yellow) reaches
     4.5:1. A colour used AS text goes only on white and uses "-600".
     Never colour-on-colour (no green text on green).
     Gate: python3 scripts/check-contrast.py */

  /* Yellow - primary (buttons, progress, values on dark panels) */
  --yellow:      #FFD500;
  --yellow-600:  #F0C800;  /* hover / press          */
  --yellow-soft: #FFD500;  /* chip / panel fill      */
  --yellow-ink:  #1C1917;  /* text on yellow         */

  /* Blue - secondary (panels, chips, correct / selected state) */
  --blue:      #1E8FC2;
  --blue-600:  #177AA8;
  --blue-soft: #177AA8;   /* = blue-600, white text 4.8:1 */
  --blue-ink:  #FFFFFF;

  /* Green - secondary support (chips, success) */
  --green:      #00A651;
  --green-600:  #078342;  /* hover / press, AA text shade */
  --green-soft: #078342;  /* = green-600, white text 4.9:1 */
  --green-ink:  #FFFFFF;

  /* Red - danger / important / wrong (use sparingly) */
  --red:      #E5322D;
  --red-600:  #C92823;
  --red-soft: #C92823;   /* = red-600, white text 5.5:1 */
  --red-ink:  #FFFFFF;

  /* Grape - 5th category tone (colour-coded groups), from the play palette */
  --grape:      #7A5AC2;
  --grape-soft: #7A5AC2;  /* white text 5.2:1 */
  --grape-ink:  #FFFFFF;

  /* Legacy role aliases - older edulab apps use these names */
  --marigold: var(--yellow); --marigold-600: var(--yellow-600); --marigold-soft: var(--yellow-soft); --marigold-ink: var(--yellow-ink);
  --teal:     var(--blue);   --teal-600:     var(--blue-600);   --teal-soft:     var(--blue-soft);   --teal-ink:     var(--blue-ink);
  --sky:      var(--green);                                     --sky-soft:      var(--green-soft);  --sky-ink:      var(--green-ink);
  --coral:    var(--red);    --coral-600:    var(--red-600);    --coral-soft:    var(--red-soft);    --coral-ink:    var(--red-ink);

  /* Play palette - subject/category colours in the kids app */
  --play-sun:    #FFD500;
  --play-grass:  #00A651;
  --play-berry:  #C6478B;
  --play-grape:  #7A5AC2;
  --play-sky:    #1E8FC2;
  --play-coral:  #E5322D;

  /* ---- Semantic ---- */
  --success:      #00A651;  --success-soft: #078342;  --success-ink: #FFFFFF;
  --warning:      #FFD500;  --warning-soft: #FFD500;  --warning-ink: #1C1917;
  --danger:       #E5322D;  --danger-soft:  #C92823;  --danger-ink:  #FFFFFF;
  --info:         #1E8FC2;  --info-soft:    #177AA8;  --info-ink:    #FFFFFF;

  /* ---- Functional aliases ---- */
  --bg:        var(--paper);
  --fg:        var(--ink);
  --fg-muted:  var(--ink-2);
  --primary:   var(--yellow);
  --on-primary:#1C1917;      /* dark text on yellow */
  /* White gap + ink band: >= 3:1 on paper, sand, yellow and every chip fill.
     Pair with `outline: 3px solid transparent` so forced-colours mode still shows focus. */
  --focus-ring: 0 0 0 2px var(--paper), 0 0 0 5px var(--ink);
  /* Range-slider track */
  --track: color-mix(in srgb, var(--ink) 24%, transparent);

  /* ============================================================
     SPACING  (4pt base)
     ============================================================ */
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;
  --sp-12: 48px; --sp-16: 64px; --sp-20: 80px; --sp-24: 96px;

  /* ---- Radii (friendly, generous) ---- */
  --r-xs: 6px; --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 28px; --r-pill: 999px;

  /* ---- Elevation - warm, low, soft ---- */
  --shadow-sm: 0 1px 2px rgba(33,30,26,.10), 0 2px 6px rgba(33,30,26,.06);
  --shadow-md: 0 6px 18px rgba(33,30,26,.12), 0 1px 3px rgba(33,30,26,.08);
  --shadow-lg: 0 16px 40px rgba(33,30,26,.12), 0 3px 8px rgba(33,30,26,.06);
  --shadow-primary:  0 8px 22px color-mix(in srgb, var(--yellow) 30%, transparent);
  --shadow-marigold: var(--shadow-primary);   /* legacy alias */

  /* ============================================================
     TYPE SCALE (semantic sizes)
     ============================================================ */
  --display-font:  clamp(48px, 6vw, 72px);
  --h1: 44px; --h2: 33px; --h3: 25px; --h4: 19px;
  --body-lg: 18px; --body: 16px; --body-sm: 14px;
  --caption: 13px; --overline: 12px;
}

/* ============================================================
   SEMANTIC ELEMENT STYLES
   Apply via element selectors or .edu-prose wrapper.
   Element defaults are wrapped in :where(.edu) (zero specificity) so any
   single class wins: <p class="edu-overline">, <p class="edu-small">,
   <h1 class="app-title"> keep their own font/size instead of the element default.
   ============================================================ */

.edu-display, :where(.edu) h1.display {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: var(--display-font);
  line-height: 1.02;
  letter-spacing: -0.025em;
  color: var(--ink);
}
:where(.edu) h1, .edu-h1 {
  font-family: var(--font-display);
  font-weight: 700; font-size: var(--h1);
  line-height: 1.06; letter-spacing: -0.02em; color: var(--ink);
}
:where(.edu) h2, .edu-h2 {
  font-family: var(--font-display);
  font-weight: 700; font-size: var(--h2);
  line-height: 1.12; letter-spacing: -0.015em; color: var(--ink);
}
:where(.edu) h3, .edu-h3 {
  font-family: var(--font-display);
  font-weight: 700; font-size: var(--h3);
  line-height: 1.2; letter-spacing: -0.01em; color: var(--ink);
}
:where(.edu) h4, .edu-h4 {
  font-family: var(--font-sans);
  font-weight: 700; font-size: var(--h4);
  line-height: 1.3; color: var(--ink);
}
:where(.edu) p, .edu-p, .edu-body {
  font-family: var(--font-sans);
  font-weight: 400; font-size: var(--body);
  line-height: 1.6; color: var(--ink-2);
}
.edu-body-lg { font-family: var(--font-sans); font-size: var(--body-lg); line-height: 1.6; color: var(--ink-2); }
.edu-small  { font-family: var(--font-sans); font-size: var(--body-sm); line-height: 1.5; color: var(--ink-2); }
.edu-caption{ font-family: var(--font-sans); font-size: var(--caption); line-height: 1.45; color: var(--ink-3); }

/* Overline - mono, tracked; functional labels only (never above page/section titles) */
.edu-overline {
  font-family: var(--font-mono);
  font-weight: 500; font-size: var(--overline);
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ink);
}
:where(.edu) code, .edu-mono {
  font-family: var(--font-mono);
  font-size: 0.92em; color: var(--ink);
  background: var(--paper-3); padding: 0.12em 0.4em; border-radius: var(--r-xs);
}

/* Solid colour blocks (callouts, stat cards, chips): set background: var(--X-soft) and
   color: var(--X-ink) on the block, add .edu-block, and every heading/paragraph inside
   inherits that text colour instead of the default ink. */
.edu-block, .edu-block h1, .edu-block h2, .edu-block h3, .edu-block h4, .edu-block p,
.edu-block li, .edu-block small { color: inherit; }

body.edu { background: var(--paper); color: var(--ink); font-family: var(--font-sans); }
  </style>
  <style>
    /* ─── Base ─── */
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; display: flex; flex-direction: column; overflow: hidden; }
    :focus-visible { outline: 3px solid transparent; outline-offset: 2px; box-shadow: var(--focus-ring); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    [hidden] { display: none !important; }
    .ic { width: 18px; height: 18px; flex: none; }

    /* ─── Top menu ─── */
    .edu-header { position: sticky; top: 0; z-index: 50; width: 100%; background: var(--paper); border-bottom: 1px solid var(--line-2); flex: none; }
    .edu-header-inner { padding: 6px 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .edu-logo { width: 56px; height: 56px; display: block; margin-right: -6px; }
    .edu-wordmark { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: -.02em; color: var(--ink); }
    .app-name { font-family: var(--font-display); font-weight: 600; font-size: 17px; color: var(--ink-2); margin-left: 6px; }
    .hdr-ctrl { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .edu-seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--paper-2); border-radius: var(--r-pill); }
    .edu-seg button { border: none; background: transparent; padding: 7px 14px; border-radius: var(--r-pill); font-family: var(--font-sans); font-weight: 600; color: var(--ink-2); cursor: pointer; transition: background-color .15s; }
    .edu-seg button:hover { background: var(--paper-3); }
    .edu-seg button.active { background: var(--yellow); color: var(--yellow-ink); }

    /* ─── Buttons ─── */
    .edu-btn, .btn-ghost { display: inline-flex; align-items: center; gap: 7px; border-radius: var(--r-pill); padding: 9px 18px; font-family: var(--font-display); font-weight: 600; font-size: 16px; cursor: pointer; transition: background-color .15s, transform .12s cubic-bezier(.32,.72,.32,1); }
    .edu-btn { background: var(--yellow); color: var(--on-primary); border: 1px solid var(--yellow); box-shadow: var(--shadow-primary); }
    .edu-btn:hover { background: var(--yellow-600); }
    .btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--line-strong); }
    .btn-ghost:hover { background: var(--paper-2); }
    .icon-only { padding: 9px 11px; }
    .edu-btn:active, .btn-ghost:active { transform: scale(.96); }
    .edu-btn:disabled, .btn-ghost:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    /* ─── Chips & tones ─── */
    .edu-chip { font-family: var(--font-mono); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; padding: 4px 10px; border-radius: var(--r-pill); white-space: nowrap; }
    .chip-stone  { background: var(--paper-3); color: var(--ink); }
    .chip-yellow { background: var(--yellow-soft); color: var(--yellow-ink); }
    .chip-green  { background: var(--green-soft); color: var(--green-ink); }
    .tone-stone  { background: var(--paper-3); color: var(--ink); }
    .tone-blue   { background: var(--blue-soft); color: var(--blue-ink); }
    .tone-yellow { background: var(--yellow-soft); color: var(--yellow-ink); }
    .tone-green  { background: var(--green-soft); color: var(--green-ink); }
    .tone-grape  { background: var(--grape-soft); color: var(--grape-ink); }
    .tone-ink    { background: var(--ink); color: var(--yellow); }
    .tone-off    { background: var(--paper-2); color: var(--ink-3); border: 1px dashed var(--line-2); }
    .badge { flex: none; width: 34px; height: 34px; border-radius: var(--r-sm); display: inline-grid; place-items: center; }
    .edu-overline { margin: 0; }

    /* ─── App layout ─── */
    .app { flex: 1; display: grid; grid-template-columns: minmax(330px, 32%) minmax(0, 1fr); min-height: 0; }

    /* ─── Chat (customer view) ─── */
    .chat { background: var(--paper-2); border-right: 1px solid var(--line-2); display: flex; flex-direction: column; gap: 14px; padding: 20px 22px; min-height: 0; font-size: clamp(14px, .95vw, 18px); }
    .chat-head { display: flex; align-items: center; gap: 12px; }
    .chat-head h2 { margin: 0; font-size: 1.25em; }
    .chat-log { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 4px 2px; }
    .chat-log > :first-child { margin-top: auto; }
    .msg-bot, .msg-me, .typing { max-width: 92%; border-radius: 16px; padding: 11px 15px; line-height: 1.5; animation: msgIn .25s ease-out both; }
    .msg-bot { align-self: flex-start; background: var(--surface); border: 1px solid var(--line-2); border-bottom-left-radius: 5px; color: var(--ink); }
    .msg-me { align-self: flex-end; background: var(--blue-soft); color: var(--blue-ink); border-bottom-right-radius: 5px; overflow-wrap: anywhere; }
    .msg-bot p { margin: 0 0 8px; color: var(--ink); white-space: pre-wrap; }
    .msg-bot p:last-child { margin-bottom: 0; }
    .typing { align-self: flex-start; display: inline-flex; gap: 5px; background: var(--surface); border: 1px solid var(--line-2); }
    .typing i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); animation: dot 1.2s infinite ease-in-out; }
    .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
    @keyframes dot { 0%, 80%, 100% { opacity: .3; } 40% { opacity: 1; } }
    @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } }
    .sources { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line-2); display: grid; gap: 6px; }
    .sources .edu-overline { font-size: 11px; }
    .doc-link { display: inline-flex; align-items: center; gap: 7px; color: var(--blue-600); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; overflow-wrap: anywhere; }
    .doc-link:hover { color: var(--ink); }
    .doc-link .ic { width: 16px; height: 16px; }
    .samples { display: flex; flex-wrap: wrap; gap: 6px; }
    .sample { border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); border-radius: var(--r-pill); padding: 5px 12px; font-family: var(--font-sans); font-size: .82em; cursor: pointer; text-align: left; transition: background-color .15s; }
    .sample:hover { background: var(--paper-3); }
    .sample[aria-pressed="true"] { background: var(--blue-soft); border-color: var(--blue-soft); color: var(--blue-ink); }
    .chat-form { display: flex; gap: 8px; }
    .chat-input { flex: 1; min-width: 0; padding: 11px 16px; border: 1px solid var(--line-strong); border-radius: var(--r-pill); font: inherit; font-size: 1em; background: var(--surface); color: var(--ink); }
    .chat-input::placeholder { color: var(--ink-3); }
    .chat-input[readonly] { background: var(--paper-3); }

    /* ─── Behind the scenes ─── */
    .back { display: flex; flex-direction: column; gap: 16px; padding: 18px 28px 20px; min-height: 0; min-width: 0; font-size: clamp(14px, 1vw, 20px); }
    .stepper { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
    .step-btn { display: inline-flex; align-items: center; gap: 8px; border: none; background: transparent; padding: 3px 10px 3px 3px; border-radius: var(--r-pill); font-family: var(--font-display); font-weight: 600; font-size: 15px; color: var(--ink); cursor: pointer; }
    .step-btn .badge { width: 30px; height: 30px; border-radius: 9px; }
    .step-btn .badge .ic { width: 16px; height: 16px; }
    .step-btn:disabled { cursor: default; }
    .step-btn:not(:disabled):hover { background: var(--paper-2); }
    .step-btn[aria-current="step"] { background: var(--yellow); color: var(--yellow-ink); }
    .step-sep { width: 16px; height: 1px; background: var(--line-2); }
    .stage-card { flex: 1; min-height: 0; background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); overflow: hidden; display: flex; flex-direction: column; }
    .stage-nav { display: flex; align-items: center; gap: 14px; flex: none; }
    .stage-nav .edu-btn { margin-left: auto; font-size: 17px; padding: 11px 22px; }
    .nav-hint { color: var(--ink-2); font-size: .9em; }
    .stage-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 22px; background: var(--paper-2); border-bottom: 1px solid var(--line); flex: none; }
    .stage-head .tile-h { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .stage-head h3 { margin: 0; font-size: 1.45em; }
    .stage-body { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 24px 24px; display: flex; flex-direction: column; gap: 18px; }
    .stage-body > * { flex-shrink: 0; }
    .stage-body > .prompt-grid { flex-shrink: 1; }
    .talk { margin: 0; font-size: 1.12em; line-height: 1.5; color: var(--ink-2); }
    .reveal > * { animation: fadeUp .35s ease-out both; animation-delay: calc(var(--i, 0) * 70ms); }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } }
    .over-mono { font-family: var(--font-mono); font-size: .72em; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--ink); margin: 0; }
    .s-prog { height: 6px; background: var(--paper-3); flex: none; }
    .s-prog span { display: block; height: 100%; background: var(--yellow); transition: width .3s; }
    .callout { border-radius: var(--r-md); padding: 14px 18px; display: flex; gap: 12px; align-items: flex-start; }
    .callout p { margin: 0; }

    /* ─── Vector database ─── */
    .vdb { border: 1px solid var(--line-2); border-radius: var(--r-lg); overflow: hidden; }
    .vdb-head { display: flex; align-items: center; gap: 12px; padding: 12px 18px; }
    .vdb-head h4 { margin: 0; font-family: var(--font-display); font-size: 1.15em; flex: 1; color: inherit; }
    .vdb-head .qcode { display: flex; align-items: center; gap: 10px; }
    .vdb-head .meta { font-family: var(--font-mono); font-size: .75em; letter-spacing: .06em; text-transform: uppercase; }
    .vdb-head.tone-ink h4 { color: var(--paper); }
    .vdb-head.tone-ink .meta { color: var(--yellow); }
    .vdb-head.tone-stone { border-bottom: 1px solid var(--line-2); }
    .vdb-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; padding: 14px; background: var(--paper-2); }
    .rec { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-md); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; transition: background-color .2s, border-color .2s; }
    .rec-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .rec-top .ic { color: var(--ink-2); }
    .rec-title { margin: 0; font-weight: 600; font-size: .92em; line-height: 1.3; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .rec-text { margin: 0; font-size: .82em; line-height: 1.45; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    .rec-body { display: grid; margin-top: auto; }
    .rec-body > * { grid-area: 1 / 1; min-width: 0; }
    .rec-vec { display: grid; gap: 6px; align-content: end; }
    .rec-nums { margin: 0; font-family: var(--font-mono); font-size: .68em; line-height: 1.45; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
    .vdb.embedding .rec-text { animation: fadeOut .4s ease-in both; animation-delay: calc(var(--i, 0) * .35s + .6s); }
    .vdb.embedding .rec-vec { animation: fadeIn .5s ease-out both; animation-delay: calc(var(--i, 0) * .35s + .9s); }
    @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }
    @keyframes fadeIn { from { opacity: 0; } }

    /* vector barcode: one bar per number, up for positive, down for negative */
    .code { position: relative; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 2px; height: 2.6em; }
    .code::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--line-2); }
    .code i { position: relative; }
    .code i::before { content: ""; position: absolute; left: 0; right: 0; bottom: 50%; height: calc(var(--h) * 50%); background: var(--ink); border-radius: 2px; }
    .code i.neg::before { bottom: auto; top: 50%; }
    .code-lg { height: 6em; gap: 4px; }
    .code-q { width: 13em; height: 1.9em; flex: none; }
    .code-q::after { background: var(--ink-3); }
    .code-q i::before { background: var(--yellow); }
    .rec[data-hit="true"] { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink), var(--shadow-md); }
    .rec[data-hit="false"] { background: var(--paper-2); }
    .rec[data-hit="false"] .code i::before { background: var(--line-strong); }
    .rec[data-hit="false"] .rec-title { color: var(--ink-2); font-weight: 500; }
    .vdb-foot { padding: 10px 18px; border-top: 1px solid var(--line-2); font-size: .9em; color: var(--ink-2); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    /* question vector */
    .qvec { display: grid; gap: 14px; }
    .num-grid { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
    .num-grid span { font-family: var(--font-mono); font-size: .95em; text-align: center; padding: 6px 4px; background: var(--paper-2); border-radius: var(--r-xs); color: var(--ink); animation: fadeUp .3s ease-out both; animation-delay: calc(var(--i, 0) * 25ms); }
    .bubble { font-family: var(--font-display); font-weight: 600; font-size: 2em; line-height: 1.25; background: var(--paper-2); border: 1px solid var(--line-2); border-radius: var(--r-lg); padding: 18px 24px; margin: 0; overflow-wrap: anywhere; }

    /* prompt */
    .prompt-grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 14px; flex: 1; min-height: 0; }
    .msg { border: 1px solid var(--line-2); border-radius: var(--r-md); overflow: hidden; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .msg-head { padding: 9px 14px; background: var(--paper-3); border-bottom: 1px solid var(--line-2); }
    .msg-text { margin: 0; padding: 12px 14px; font-family: var(--font-mono); font-size: .8em; line-height: 1.6; color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; overflow-y: auto; flex: 1; }

    /* answer stage */
    .answer-text { margin: 0; white-space: pre-wrap; font-size: 1.05em; line-height: 1.55; color: var(--ink); }
    .answer-src { display: grid; gap: 8px; }

    /* ─── Flow page (how RAG works / what just happened) ─── */
    body[data-wide="true"] .app { grid-template-columns: minmax(0, 1fr); }
    body[data-wide="true"] .chat { display: none; }
    .flow { --beat: 1s; flex: 1; font-size: 1.18em; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr) 2.4em) minmax(0, 1fr); grid-template-rows: auto auto minmax(2.8em, auto) auto; align-content: center; row-gap: 8px; }
    .lane { margin: 0; align-self: end; padding-bottom: 2px; font-family: var(--font-mono); font-size: .72em; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
    .fnode { display: flex; flex-direction: column; gap: 10px; min-width: 0; padding: .8em .85em; border: 1px solid var(--line-2); border-radius: var(--r-md); background: var(--surface); box-shadow: var(--shadow-sm); font: inherit; color: var(--ink); text-align: left; }
    button.fnode { cursor: pointer; transition: background-color .2s; }
    button.fnode:hover { background: var(--paper-2); }
    .fnode-h { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .fnode .badge { width: 2.1em; height: 2.1em; }
    .fnode .badge .ic { width: 1.1em; height: 1.1em; }
    .fnode-h strong { font-family: var(--font-display); font-weight: 700; font-size: 1em; line-height: 1.2; }
    .fnode-d { font-size: .82em; line-height: 1.4; color: var(--ink-2); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    .fnode-d.mono { font-family: var(--font-mono); font-size: .76em; }
    .flink { position: relative; align-self: center; height: 2px; margin: 0 6px 0 4px; background: var(--line-strong); }
    .flink::after { content: ""; position: absolute; right: -3px; top: -5px; border-left: 8px solid var(--line-strong); border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
    .flink i { position: absolute; top: -5px; left: 0; width: 12px; height: 12px; border-radius: 50%; background: var(--yellow); box-shadow: 0 0 0 2px var(--ink); opacity: 0; }
    .vlink { justify-self: center; align-self: stretch; width: 2px; height: auto; margin: 2px 0 8px; }
    .vlink::after { right: -5px; top: auto; bottom: -3px; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 8px solid var(--line-strong); border-bottom: 0; }
    .vlink i { left: -5px; top: 0; }
    .flow.play .fnode { animation: fadeUp .45s ease-out both, nodeOn 1.6s ease-out both; animation-delay: calc(var(--t) * var(--beat)); }
    .flow.play .lane { animation: fadeUp .45s ease-out both; animation-delay: calc(var(--t) * var(--beat)); }
    .flow.play .flink { animation: fadeIn .3s ease-out both; animation-delay: calc((var(--t) - .75) * var(--beat)); }
    .flow.play .flink i { animation: dotX calc(var(--beat) * .7) ease-in-out both; animation-delay: calc((var(--t) - .75) * var(--beat)); }
    .flow.play .vlink i { animation-name: dotY; }
    @keyframes nodeOn { from { box-shadow: 0 0 0 3px var(--yellow), var(--shadow-md); } }
    @keyframes dotX { 0% { opacity: 0; left: 0; } 15%, 85% { opacity: 1; } 100% { opacity: 0; left: calc(100% - 12px); } }
    @keyframes dotY { 0% { opacity: 0; top: 0; } 15%, 85% { opacity: 1; } 100% { opacity: 0; top: calc(100% - 12px); } }
    .btn-sm { padding: 5px 12px; font-size: 14px; }

    /* map dialog: the flow with the current stage marked */
    .fnode[data-state="todo"] { background: var(--paper-2); border-style: dashed; box-shadow: none; }
    .fnode[data-state="todo"] .fnode-h strong { color: var(--ink-2); font-weight: 600; }
    .fnode[data-current="true"] { border-color: var(--ink); box-shadow: 0 0 0 3px var(--yellow), var(--shadow-md); }
    .fnode .here { align-self: flex-start; }
    .map-dialog { width: min(1500px, 96vw); max-width: 96vw; max-height: 94dvh; border: 1px solid var(--line-2); border-radius: var(--r-lg); padding: 0; background: var(--paper); color: var(--ink); box-shadow: var(--shadow-lg); overflow: hidden; }
    .map-dialog[open] { display: flex; flex-direction: column; animation: fadeUp .25s ease-out; }
    .map-dialog::backdrop { background: color-mix(in srgb, var(--ink) 35%, transparent); }
    .map-body { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 24px 26px; display: flex; flex-direction: column; gap: 14px; font-size: clamp(14px, 1vw, 20px); }
    .map-body .talk { font-size: 1em; }

    /* ─── Documents drawer ─── */
    .drawer { margin: 0 0 0 auto; height: 100dvh; max-height: 100dvh; width: min(600px, 100vw); max-width: 100vw; border: none; border-left: 1px solid var(--line-2); padding: 0; background: var(--paper); color: var(--ink); box-shadow: var(--shadow-lg); }
    .drawer[open] { display: flex; flex-direction: column; animation: slideIn .25s ease-out; }
    .drawer::backdrop { background: color-mix(in srgb, var(--ink) 35%, transparent); }
    @keyframes slideIn { from { transform: translateX(30px); opacity: 0; } }
    .drawer-head { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line-2); background: var(--paper-2); }
    .drawer-head h2 { margin: 0; font-size: 1.35rem; flex: 1; }
    .drawer-body { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 20px 28px; display: flex; flex-direction: column; gap: 14px; }
    .doc { flex: none; background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-lg); overflow: hidden; scroll-margin: 16px; }
    .doc[data-focus="true"] { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink), var(--shadow-md); }
    .doc-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; background: var(--paper-2); border-bottom: 1px solid var(--line); }
    .doc-head .tile-h { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .doc-head h3 { margin: 0; font-size: 1.05rem; line-height: 1.3; }
    .doc-body { padding: 14px 16px; }
    .doc-body p { margin: 0; font-size: var(--body-sm); }
    .doc-foot { padding: 12px 16px; border-top: 1px dashed var(--line-2); display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 14px; color: var(--ink-2); }
    .doc-foot code { font-family: var(--font-mono); color: var(--ink); }

    /* ─── Responsive ─── */
    @media (max-width: 1280px) { .vdb-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .rec-text { -webkit-line-clamp: 2; } }
    @media (max-width: 768px) {
      body { overflow: auto; height: auto; }
      .edu-header-inner { padding: 6px 12px; }
      .edu-logo { width: 44px; height: 44px; }
      .app-name { display: none; }
      .app { grid-template-columns: 1fr; }
      .chat { border-right: none; border-bottom: 1px solid var(--line-2); padding: 14px; }
      .chat-log { max-height: 60vh; }
      .back { padding: 14px 12px 18px; }
      .stage-card { flex: none; }
      .stage-body { padding: 14px; overflow: visible; }
      .prompt-grid { grid-template-columns: 1fr; }
      .bubble { font-size: 1.4em; }
      .step-btn .lbl { display: none; }
      .num-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .flow { display: flex; flex-direction: column; gap: 6px; }
      .flow .flink { align-self: center; width: 2px; height: 18px; margin: 0 0 6px; }
      .flow .flink::after { right: -5px; top: auto; bottom: -4px; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 8px solid var(--line-strong); border-bottom: 0; }
      .flow .flink i, .flow .vlink { display: none; }
      .lane { align-self: flex-start; padding-top: 8px; }
      .flow { font-size: 1em; }
      .stage-head { flex-wrap: wrap; }
      .btn-sm span, #mapButton span { display: none; }
      #mapButton { padding: 9px 11px; }
      .map-dialog .drawer-head { flex-wrap: wrap; }
      #mapHere { order: 5; white-space: normal; }
      .map-body { padding: 14px; }
    }
    /* ─── Short screens (1366×768 projectors) ─── */
    @media (max-height: 820px) {
      .back { padding: 12px 24px 12px; gap: 10px; }
      .stage-head { padding: 9px 18px; }
      .stage-head h3 { font-size: 1.25em; }
      .vdb-grid { gap: 8px; padding: 10px; }
      .rec { padding: 8px 10px; gap: 6px; }
      .rec-text { -webkit-line-clamp: 2; }
      .code-lg { height: 4.5em; }
      .num-grid span { padding: 4px; }
      .fnode { padding: 10px; gap: 6px; }
      .vdb-head { padding: 9px 16px; }
      .vdb-foot { padding: 8px 16px; }
      .stage-body { padding: 12px 20px 14px; gap: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .vdb.embedding .rec-text { visibility: hidden; }
    }
  </style>
</head>

        emptyQuery: '(empty question)',
        roleSystem: 'System prompt', roleUser: 'User message',
        promptContext: 'CONTEXT', promptQuestion: 'QUESTION',
        promptNoContext: '(no documents above the similarity threshold)',
        promptSimilarity: 'similarity',
        sourcesTitle: 'Sources',
        docShort: 'Doc',
        drawerTitle: 'Knowledge base documents',
        vector: 'Vector',
        notEmbedded: 'not embedded yet',
        simToQuery: 'similarity to the question {v}',
        liveEmbedded: 'Embedded {n} documents.',
        liveAsked: 'The customer sent the question.',
        liveQueryEmbedded: 'Question converted to a vector.',
        liveMatched: 'Documents retrieved: {n}.',
        livePrompt: 'Prompt built.',
        liveAnswered: 'Answer sent to the customer.',
        liveRecap: 'Recap: the whole path of the question.',
        liveReset: 'Simulation restarted.',
        systemPrompt: "You are a technical support assistant for TechX, SoundWave, PixelPlus and SmartView products.\n\nRules:\n1. Answer only from the documents in the CONTEXT section.\n2. If the context does not contain the answer, say you have no information about it. Do not guess and do not use knowledge from outside the context.\n3. Give step-by-step instructions where possible.\n4. Name the documents you used, e.g. [Doc 1].\n5. Reply in the user's language.",
        laptopFreeze: "If your TechX Pro 13 laptop is frozen or unresponsive, you should:\n\n1. Press and hold the power button for 10 seconds to force a shutdown\n2. Wait at least 30 seconds before turning it back on\n3. If this doesn't resolve the issue, try resetting the SMC by holding Shift+Control+Option and the power button simultaneously for 10 seconds\n\nIf the problem persists, it might indicate a more serious hardware issue requiring service.",
        headphonesPair: "To pair your SoundWave X300 headphones with a new device:\n\n1. Press and hold the multifunction button for 5 seconds until the LED flashes blue and red alternately\n2. Enable Bluetooth on your device\n3. Select 'SoundWave X300' from the list of available devices\n4. The LED will turn solid blue when successfully connected\n\nIf you're having trouble connecting, try resetting your headphones by holding both volume buttons for 10 seconds.",
        tvMirror: "To mirror your screen to a SmartView 4K TV:\n\n1. Make sure both your device and TV are connected to the same WiFi network\n2. On your device, open the screen mirroring function (AirPlay on Apple, SmartView on Android)\n3. Select your TV from the list of available devices\n4. For Windows PC, press Windows+K to open the casting menu\n\nIf you're having connection issues, try restarting both your device and TV.",
        none: 'The knowledge base has no documents that match this question, so the system will not answer it. Admitting missing data beats guessing.',
        combineIntro: 'Based on the information I have:',
      },
    };

    // ─── State ───
    const savedLang = localStorage.getItem(LANG_KEY);
    const state = {
      lang: LANGS.includes(savedLang) ? savedLang : 'pl',
      done: 1,             // stages reached, 1..STEP_COUNT (the intro is always reached)
      view: 0,             // stage shown behind the scenes
      query: '',
      docVectors: null,    // { [docId]: number[] } once embedded
      queryVector: null,
      scores: [],          // every doc with its similarity, sorted desc
      retrieved: [],       // docs above MIN_SIMILARITY, top K
      answer: null,        // { kind: 'none' } | { kind: 'template', id, docIds } | { kind: 'combine', docIds }
      focusDoc: null,      // doc highlighted in the drawer
      animateEmbed: false, // play the text-to-vector animation on the next render of the docs stage
    };
    state.query = SAMPLES[state.lang][0];
    let stageKey = '';     // re-render the stage card only when this changes
    let chatKey = '';      // re-render the chat log only when this changes

    // ─── DOM refs ───
    const $ = id => document.getElementById(id);
    const queryInput = $('queryInput');
    const chatForm = $('chatForm');
    const sendButton = $('sendButton');
    const chatLog = $('chatLog');
    const samplesEl = $('samples');
    const backButton = $('backButton');
    const nextButton = $('nextButton');
    const nextLabel = $('nextLabel');
    const navHint = $('navHint');
    const resetButton = $('resetButton');
    const docsButton = $('docsButton');
    const stepperEl = $('stepper');
    const stageCard = $('stageCard');
    const progressBar = $('progressBar');
    const progressFill = $('progressFill');
    const liveEl = $('live');
    const drawer = $('drawer');
    const drawerBody = $('drawerBody');
    const drawerClose = $('drawerClose');
    const mapButton = $('mapButton');
    const mapDialog = $('mapDialog');
    const mapBody = $('mapBody');
    const mapHere = $('mapHere');
    const mapClose = $('mapClose');
    const langButtons = [...document.querySelectorAll('.edu-seg button')];

    // ─── Helpers ───
    function t(key, vars) {
      let s = T[state.lang][key] ?? T.en[key] ?? key;
      if (vars && typeof s === 'string') Object.entries(vars).forEach(([k, v]) => { s = s.replaceAll('{' + k + '}', v); });
      return s;
    }
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const icon = (name, cls = 'ic') => `<i data-lucide="${name}" class="${cls}" aria-hidden="true"></i>`;
    const fmt2 = v => (Math.abs(v) < 0.005 ? 0 : v).toFixed(2);
    const docById = id => DOCS.find(d => d.id === id);
    const stageTitle = i => t('stageTitles')[i];
    const scoreOf = id => state.scores.find(s => s.id === id);

    // Topic weights of a text: the hidden "meaning" the toy model works from
    const topicsOf = text => { const lower = text.toLowerCase(); return TOPICS.map(f => (f.rx.test(lower) ? f.w : 0)); };

    function wordNoise(text) {
      const out = new Array(NOISE_DIMS).fill(0);
      (text.toLowerCase().match(/\p{L}+/gu) || []).forEach(word => {
        let h = 2166136261;
        for (const ch of word) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); }
        out[(h >>> 0) % NOISE_DIMS] += (h >>> 8) & 1 ? 1 : -1;
      });
      const n = Math.hypot(...out);
      return n ? out.map(x => x / n * NOISE_WEIGHT) : out;
    }

    function embed(text) {
      const hidden = [...topicsOf(text), BASE_WEIGHT, ...wordNoise(text)];
      const v = new Array(DIMS).fill(0);
      hidden.forEach((x, c) => { if (x) for (let i = 0; i < DIMS; i++) v[i] += x * ROTATION[c][i]; });
      const n = Math.hypot(...v);
      return v.map(x => x / n);
    }

    // Vectors are unit length, so the dot product is the cosine similarity
    const cosine = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

    function embedDocs() {
      // Embed the English source text; the Polish translation maps to the same vector.
      state.docVectors = Object.fromEntries(DOCS.map(d => [d.id, embed(d.text.en)]));
    }

    function retrieveDocs() {
      state.scores = DOCS
        .map(d => ({ id: d.id, similarity: cosine(state.queryVector, state.docVectors[d.id]) }))
        .sort((a, b) => b.similarity - a.similarity);
      state.retrieved = state.scores.filter(s => s.similarity >= MIN_SIMILARITY).slice(0, TOP_K);
    }

    function generateAnswer() {
      if (!state.retrieved.length) return { kind: 'none' };
      const q = state.query.toLowerCase();
      const hitIds = state.retrieved.map(r => r.id);
      const tpl = TEMPLATES.find(x => x.test(q) && hitIds.includes(x.docId));
      if (tpl) return { kind: 'template', id: tpl.id, docIds: [tpl.docId] };
      return { kind: 'combine', docIds: hitIds };
    }

    // User message sent to the model: retrieved documents as context, then the question
    function buildUserPrompt() {
      const context = state.retrieved.length
        ? state.retrieved.map(r => {
            const d = docById(r.id);
            return `[${t('docShort')} ${d.id}] ${d.title[state.lang]} (${t('promptSimilarity')} ${fmt2(r.similarity)})\n${d.text[state.lang]}`;
          }).join('\n\n')
        : t('promptNoContext');
      return `${t('promptContext')}:\n${context}\n\n${t('promptQuestion')}:\n${state.query.trim() || t('emptyQuery')}`;
    }

    function clearQueryResults() {
      state.queryVector = null;
      state.scores = [];
      state.retrieved = [];
      state.answer = null;
    }

    const lastView = () => state.done - 1;

    // The question changed: drop everything computed from the old one, keep the embedded docs
    function invalidateQuery() {
      clearQueryResults();
      if (state.done > STAGE.ask) state.done = STAGE.ask;
      if (state.view > lastView()) state.view = lastView();
    }

    function announce(key, vars) { liveEl.textContent = t(key, vars); }

    // Runs when a stage is reached for the first time
    const STAGE_ACTIONS = [
      () => {},
      () => { embedDocs(); state.animateEmbed = true; announce('liveEmbedded', { n: DOCS.length }); },
      () => announce('liveAsked'),
      () => { state.queryVector = embed(state.query); announce('liveQueryEmbedded'); },
      () => { retrieveDocs(); announce('liveMatched', { n: state.retrieved.length }); },
      () => announce('livePrompt'),
      () => { state.answer = generateAnswer(); announce('liveAnswered'); },
      () => announce('liveRecap'),
    ];

    function reachNextStage() {
      STAGE_ACTIONS[state.done]();
      state.done++;
      state.view = state.done - 1;
    }

    // → : show the next reached stage, or reach the next one
    function forward() {
      if (state.view < lastView()) state.view++;
      else if (state.done < STEP_COUNT) reachNextStage();
      else return;
      render();
    }

    function backward() {
      if (state.view <= 0) return;
      state.view--;
      render();
    }

    function goTo(view) {
      if (view < 0 || view > lastView()) return;
      state.view = view;
      render();
    }

    // Send in the chat: the question goes out (documents get embedded first if needed), one step at a time after that
    function sendQuestion() {
      if (!state.query.trim()) { queryInput.focus(); return; }
      if (state.done > STAGE.ask) { goTo(STAGE.ask); return; }
      while (state.done <= STAGE.ask) reachNextStage();
      render();
    }

    // End of the run: back to the ready vector database with the chat input focused
    function newQuestion() {
      goTo(STAGE.docs);
      queryInput.focus();
      queryInput.select();
    }

    function renderMap() {
      mapHere.textContent = t('hereStage', { stage: stageTitle(state.view) });
      mapBody.innerHTML = `<p class="talk">${esc(t('mapHint'))}</p>${flowDiagram('map')}`;
      if (window.lucide) lucide.createIcons();
    }

    function openMap() {
      if (drawer.open) drawer.close();
      renderMap();
      if (!mapDialog.open) mapDialog.showModal();
    }

    function replayFlow() {
      const flow = $('flow');
      if (!flow) return;
      flow.classList.remove('play');
      void flow.offsetWidth;   // restart the CSS animations
      flow.classList.add('play');
    }

    function resetSimulation() {
      clearQueryResults();
      state.docVectors = null;
      state.done = 1;
      state.view = 0;
      announce('liveReset');
      render();
    }

    function setQuery(q) {
      state.query = q;
      if (queryInput.value !== q) queryInput.value = q;
      invalidateQuery();
      render();
    }

    function setLang(lang) {
      if (lang === state.lang) return;
      const sampleIdx = SAMPLES[state.lang].indexOf(state.query);
      state.lang = lang;
      localStorage.setItem(LANG_KEY, lang);
      if (sampleIdx >= 0) {
        state.query = SAMPLES[lang][sampleIdx];
        queryInput.value = state.query;
        invalidateQuery();
      }
      applyStaticText();
      render();
      if (drawer.open) renderDrawer();
      if (mapDialog.open) renderMap();
    }

    function openDocs(docId = null) {
      if (mapDialog.open) mapDialog.close();
      state.focusDoc = docId;
      renderDrawer();
      if (!drawer.open) drawer.showModal();
      const target = docId && $('doc-' + docId);
      if (target) target.scrollIntoView({ block: 'start' });
      else drawerBody.scrollTop = 0;
    }

    // ─── Render: pieces ───
    // A vector drawn as a barcode: one bar per number, up for positive, down for negative
    function barcode(v, cls = '') {
      return `<div class="code ${cls}" style="--n:${v.length}" aria-hidden="true">${v.map(x => `<i${x < 0 ? ' class="neg"' : ''} style="--h:${Math.min(1, Math.abs(x) / VEC_SCALE).toFixed(2)}"></i>`).join('')}</div>`;
    }
    const numbers = (v, n = v.length) => v.slice(0, n).map(fmt2).join(', ') + (n < v.length ? ', …' : '');

    function docLink(id) {
      const d = docById(id);
      return `<a class="doc-link" href="#doc-${id}" data-doc-link="${id}">${icon('file-text')}<span>${esc(t('docShort'))} ${id} – ${esc(d.title[state.lang])}</span></a>`;
    }

    function answerText(a) {
      if (a.kind === 'template') return t(a.id);
      return [t('combineIntro'), ...a.docIds.map(id => `${t('docShort')} ${id} – ${docById(id).title[state.lang]}:\n${docById(id).text[state.lang]}`)].join('\n\n');
    }

    // Documents as vector database records; animate = text dissolving into its vector
    function vectorDb({ highlight, animate = false }) {
      const rank = Object.fromEntries(state.retrieved.map((r, i) => [r.id, i + 1]));
      const head = highlight
        ? `<div class="vdb-head tone-ink">${icon('database')}<h4>${esc(t('dbTitle'))}</h4><span class="qcode"><span class="meta">${esc(t('queryVec'))}</span>${barcode(state.queryVector, 'code-q')}</span></div>`
        : `<div class="vdb-head tone-ink">${icon('database')}<h4>${esc(t('dbTitle'))}</h4><span class="meta">${esc(t('dbMeta', { n: DOCS.length, d: DIMS }))}</span></div>`;
      const recs = DOCS.map((d, i) => {
        const vec = state.docVectors[d.id];
        const hit = highlight ? `data-hit="${!!rank[d.id]}"` : '';
        const chip = highlight && rank[d.id]
          ? `<span class="edu-chip chip-green">#${rank[d.id]} · ${fmt2(scoreOf(d.id).similarity)}</span>`
          : `<span class="edu-chip chip-stone">${esc(t('docShort'))} ${d.id}</span>`;
        return `<div class="rec" style="--i:${i}" data-doc-id="${d.id}" ${hit}>
          <div class="rec-top">${chip}${icon(PRODUCT_ICONS[d.product])}</div>
          <p class="rec-title">${esc(d.title[state.lang])}</p>
          <div class="rec-body">
            ${animate ? `<p class="rec-text">${esc(d.text[state.lang])}</p>` : ''}
            <div class="rec-vec" title="${esc(t('vector'))}: [${numbers(vec)}]">${barcode(vec)}<p class="rec-nums">[${numbers(vec, 8)}]</p></div>
          </div>
        </div>`;
      }).join('');
      const foot = highlight
        ? `<div class="vdb-foot">${state.retrieved.length
            ? `${icon('circle-check')}<span>${esc(t('hitsMeta', { n: state.retrieved.length, total: DOCS.length, k: TOP_K, min: fmt2(MIN_SIMILARITY) }))}</span>`
            : `${icon('info')}<span>${esc(t('noHits', { min: fmt2(MIN_SIMILARITY) }))}</span>`}</div>`
        : '';
      return `<div class="vdb${animate ? ' embedding' : ''}" data-embedded="true">${head}<div class="vdb-grid${animate ? '' : ' reveal'}">${recs}</div>${foot}</div>`;
    }

    // Flow: generic text until a stage is reached, then this run's data
    function flowDetail(key, filled) {
      if (!filled) return esc(t('flowIntro')[key]);
      const a = state.answer;
      switch (key) {
        case 'docs': return esc(t('recapDocs', { n: DOCS.length }));
        case 'embed': return esc(t('recapEmbed', { d: DIMS }));
        case 'db': return esc(t('recapDb', { n: DOCS.length }));
        case 'ask': return esc(t('quoted', { q: state.query.trim() || t('emptyQuery') }));
        case 'qembed': return `[${esc(numbers(state.queryVector, 3))}]`;
        case 'search': return state.retrieved.length
          ? state.retrieved.map(r => esc(t('recapHit', { id: r.id, p: Math.round(r.similarity * 100) }))).join('<br>')
          : esc(t('recapNoHits', { min: fmt2(MIN_SIMILARITY) }));
        case 'prompt': return esc(t('recapPrompt', { n: state.retrieved.length }));
        case 'llm': return esc(t('recapLlm'));
        case 'answer': return a.kind === 'none'
          ? esc(t('recapNone'))
          : `${esc(answerText(a).split('\n')[0].replace(/:$/, '…'))}<br>${esc(t('sourcesTitle'))}: ${a.docIds.map(id => `${esc(t('docShort'))} ${id}`).join(', ')}`;
      }
      return '';
    }

    // mode: 'intro' (generic, animated), 'recap' (this run, animated), 'map' (static, current stage marked)
    function flowDiagram(mode) {
      const isMap = mode === 'map';
      const firstCurrent = FLOW_NODES.find(n => n.stage === state.view);
      const parts = [`<p class="lane" style="grid-area:1 / 1 / 2 / 6; --t:0">${esc(t('laneIndex'))}</p>`];
      FLOW_NODES.forEach((n, i) => {
        if (n.key === 'ask') parts.push(
          `<span class="flink vlink" style="grid-area:3 / 5; --t:${FLOW_NODES.find(x => x.key === 'search').t}" aria-hidden="true"><i></i></span>`,
          `<p class="lane" style="grid-area:3 / 1 / 4 / 4; --t:${n.t}">${esc(t('laneQuery'))}</p>`);
        else if (i) parts.push(`<span class="flink" style="grid-area:${n.row} / ${n.col - 1}; --t:${n.t}" aria-hidden="true"><i></i></span>`);
        const reached = mode !== 'intro' && n.stage <= lastView();
        const current = isMap && n.stage === state.view;
        const here = current && n === firstCurrent ? `<span class="edu-chip chip-yellow here">${esc(t('youAreHere'))}</span>` : '';
        const inner = `${here}<span class="fnode-h"><span class="badge ${reached || mode === 'intro' ? n.tone : 'tone-off'}">${icon(n.icon)}</span><strong>${esc(t('flowNames')[n.key])}</strong></span><span class="fnode-d${reached && n.key === 'qembed' ? ' mono' : ''}">${flowDetail(n.key, reached)}</span>`;
        const attrs = `class="fnode" style="grid-area:${n.row} / ${n.col}; --t:${n.t}" data-node="${n.key}"${isMap ? ` data-state="${reached ? 'done' : 'todo'}" data-current="${current}"` : ''}`;
        parts.push(reached
          ? `<button type="button" ${attrs} data-goto="${n.stage}"${current ? ' aria-current="step"' : ''}>${inner}</button>`
          : `<div ${attrs}>${inner}</div>`);
      });
      return `<div class="flow${isMap ? '' : ' play'}" id="${isMap ? 'mapFlow' : 'flow'}" data-flow="${mode}">${parts.join('')}</div>`;
    }

    // ─── Render: stage bodies ───
    const STAGE_BODY = [
      () => flowDiagram('intro'),
      animate => vectorDb({ highlight: false, animate }),
      () => `<p class="bubble"></p>`,
      () => `<div class="qvec reveal">${barcode(state.queryVector, 'code-lg')}<div class="num-grid" title="${esc(t('queryVec'))}">${state.queryVector.map((x, i) => `<span style="--i:${i}">${fmt2(x)}</span>`).join('')}</div></div>
          <div class="callout tone-blue edu-block">${icon('info')}<p>${esc(t('vecNote', { d: DIMS }))}</p></div>`,
      () => vectorDb({ highlight: true }),
      () => `<div class="prompt-grid" data-prompt-docs="${state.retrieved.map(r => r.id).join(',')}">
          <div class="msg" data-role="system"><div class="msg-head"><span class="over-mono">${esc(t('roleSystem'))}</span></div><p class="msg-text" id="systemPromptText"></p></div>
          <div class="msg" data-role="user"><div class="msg-head"><span class="over-mono">${esc(t('roleUser'))}</span></div><p class="msg-text" id="userPromptText"></p></div>
        </div>`,
      () => {
        const a = state.answer;
        if (a.kind === 'none') return `<div class="callout tone-blue edu-block">${icon('info')}<p>${esc(t('none'))}</p></div>`;
        return `<p class="answer-text" id="answerStageText"></p>
          <div class="answer-src"><p class="over-mono">${esc(t('sourcesTitle'))}</p>${a.docIds.map(docLink).join('')}</div>`;
      },
      () => flowDiagram('recap'),
    ];

    // Text that comes from user input or long strings goes in with textContent
    function fillStageText(i) {
      if (i === STAGE.ask) stageCard.querySelector('.bubble').textContent = state.query.trim() || t('emptyQuery');
      if (i === STAGE.prompt) { $('systemPromptText').textContent = t('systemPrompt'); $('userPromptText').textContent = buildUserPrompt(); }
      if (i === STAGE.answer && state.answer.kind !== 'none') $('answerStageText').textContent = answerText(state.answer);
    }

    // ─── Render ───
    function applyStaticText() {
      document.documentElement.lang = state.lang;
      document.title = t('pageTitle');
      document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
      document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
      document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); });
      stageKey = '';
      chatKey = '';
    }

    function renderControls() {
      const b = document.body.dataset;
      b.done = state.done; b.view = state.view; b.lang = state.lang;
      b.indexed = !!state.docVectors;
      b.wide = FLOW_STAGES.includes(state.view);
      langButtons.forEach(btn => {
        const on = btn.dataset.lang === state.lang;
        btn.classList.toggle('active', on);
        btn.setAttribute('aria-pressed', on);
      });
      const atEnd = state.view === STEP_COUNT - 1;
      backButton.disabled = state.view <= 0;
      nextLabel.textContent = atEnd ? t('newQuestion') : t('nextTo', { stage: stageTitle(state.view + 1) });
      nextButton.title = atEnd ? t('newQuestionTip') : t('nextTip');
      nextButton.dataset.action = atEnd ? 'new-question' : 'next';
      navHint.textContent = state.done === STAGE.ask && state.view === STAGE.docs ? t('askHint') : '';
      samplesEl.innerHTML = SAMPLES[state.lang].map((q, i) =>
        `<button type="button" class="sample" data-sample="${i}" aria-pressed="${q === state.query}">${esc(q)}</button>`
      ).join('');
      progressFill.style.width = (state.done / STEP_COUNT * 100) + '%';
      progressBar.setAttribute('aria-valuemax', STEP_COUNT);
      progressBar.setAttribute('aria-valuenow', state.done);
    }

    function renderChat() {
      const asked = state.done > STAGE.ask;
      const answered = state.done > STAGE.answer;
      document.body.dataset.chat = answered ? 'answered' : asked ? 'typing' : 'empty';
      const key = [asked, answered, state.lang, state.query].join('|');
      if (key === chatKey) return;
      chatKey = key;
      const parts = [`<div class="msg-bot"><p>${esc(t('greeting'))}</p></div>`];
      if (asked) parts.push(`<div class="msg-me"></div>`);
      if (asked && !answered) parts.push(`<div class="typing" role="img" aria-label="${esc(t('typing'))}"><i></i><i></i><i></i></div>`);
      if (answered) {
        const a = state.answer;
        parts.push(a.kind === 'none'
          ? `<div class="msg-bot" data-answer-kind="none"><p>${esc(t('none'))}</p></div>`
          : `<div class="msg-bot" data-answer-kind="${a.kind}"><p class="chat-answer"></p><div class="sources"><span class="edu-overline">${esc(t('sourcesTitle'))}</span>${a.docIds.map(docLink).join('')}</div></div>`);
      }
      chatLog.innerHTML = parts.join('');
      const me = chatLog.querySelector('.msg-me');
      if (me) me.textContent = state.query.trim() || t('emptyQuery');
      const ans = chatLog.querySelector('.chat-answer');
      if (ans) ans.textContent = answerText(state.answer);
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    function renderStepper() {
      stepperEl.innerHTML = STAGES.map((s, i) => {
        const done = i < state.done;
        const current = i === state.view;
        const reachable = i <= lastView();
        return `${i ? '<span class="step-sep" aria-hidden="true"></span>' : ''}<button type="button" class="step-btn" data-goto="${i}" data-state="${current ? 'current' : done ? 'done' : 'todo'}" aria-label="${esc(stageTitle(i))}"${current ? ' aria-current="step"' : ''}${!reachable ? ' disabled' : ''}><span class="badge ${done || current ? s.tone : 'tone-off'}">${icon(s.icon)}</span>${current ? `<span class="lbl">${esc(stageTitle(i))}</span>` : ''}</button>`;
      }).join('');
    }

    function renderStage() {
      const key = [state.view, state.done, state.lang, state.query].join('|');
      if (key === stageKey) return;
      stageKey = key;
      const v = state.view;
      const animate = state.animateEmbed && v === STAGE.docs;
      state.animateEmbed = false;
      const replay = FLOW_STAGES.includes(v)
        ? `<button type="button" class="btn-ghost btn-sm" data-replay title="${esc(t('replayTip'))}">${icon('play')}<span>${esc(t('replay'))}</span></button>`
        : '';
      stageCard.dataset.stage = v;
      stageCard.innerHTML = `<div class="stage-head"><span class="tile-h"><span class="badge ${STAGES[v].tone}">${icon(STAGES[v].icon)}</span><h3>${esc(stageTitle(v))}</h3></span><span class="tile-h">${replay}<span class="edu-chip chip-yellow">${esc(t('stepOf', { n: v + 1, total: STEP_COUNT }))}</span></span></div>
        <div class="stage-body"><p class="talk">${esc(t('stageTalk')[v].replaceAll('{d}', DIMS))}</p>${STAGE_BODY[v](animate)}</div>`;
      fillStageText(v);
    }

    function renderDrawer() {
      drawerBody.innerHTML = DOCS.map(d => {
        const s = scoreOf(d.id);
        const inCtx = state.retrieved.some(r => r.id === d.id);
        return `<article class="doc" id="doc-${d.id}" data-doc-id="${d.id}" data-focus="${state.focusDoc === d.id}">
          <div class="doc-head"><span class="tile-h"><span class="badge tone-ink">${icon(PRODUCT_ICONS[d.product])}</span><h3>${esc(t('docShort'))} ${d.id} · ${esc(d.title[state.lang])}</h3></span>${inCtx ? `<span class="edu-chip chip-green">${esc(t('sourcesTitle'))}</span>` : ''}</div>
          <div class="doc-body"><p>${esc(d.text[state.lang])}</p></div>
          <div class="doc-foot">
            <span>${esc(t('vector'))}: ${state.docVectors ? `<code>[${state.docVectors[d.id].map(fmt2).join(', ')}]</code>` : esc(t('notEmbedded'))}</span>
            ${s ? `<span>${esc(t('simToQuery', { v: fmt2(s.similarity) }))}</span>` : ''}
          </div>
        </article>`;
      }).join('');
      if (window.lucide) lucide.createIcons();
    }

    function render() {
      renderControls();
      renderChat();
      renderStepper();
      renderStage();
      if (window.lucide) lucide.createIcons();
    }

    // ─── Listeners ───
    chatForm.addEventListener('submit', e => { e.preventDefault(); sendQuestion(); });
    queryInput.addEventListener('input', e => setQuery(e.target.value));
    samplesEl.addEventListener('click', e => {
      const btn = e.target.closest('[data-sample]');
      if (btn) setQuery(SAMPLES[state.lang][Number(btn.dataset.sample)]);
    });
    nextButton.addEventListener('click', () => (state.view === STEP_COUNT - 1 ? newQuestion() : forward()));
    backButton.addEventListener('click', backward);
    resetButton.addEventListener('click', resetSimulation);
    docsButton.addEventListener('click', () => openDocs());
    drawerClose.addEventListener('click', () => drawer.close());
    mapButton.addEventListener('click', openMap);
    mapClose.addEventListener('click', () => mapDialog.close());
    mapDialog.addEventListener('click', e => {
      if (e.target === mapDialog) { mapDialog.close(); return; }
      const btn = e.target.closest('[data-goto]');
      if (btn) { mapDialog.close(); goTo(Number(btn.dataset.goto)); }
    });
    drawer.addEventListener('click', e => { if (e.target === drawer) drawer.close(); });
    drawer.addEventListener('close', () => { state.focusDoc = null; });
    [stepperEl, stageCard].forEach(el => el.addEventListener('click', e => {
      if (e.target.closest('[data-replay]')) { replayFlow(); return; }
      const btn = e.target.closest('[data-goto]');
      if (btn && !btn.disabled) goTo(Number(btn.dataset.goto));
    }));
    document.addEventListener('click', e => {
      const link = e.target.closest('[data-doc-link]');
      if (!link) return;
      e.preventDefault();
      openDocs(Number(link.dataset.docLink));
    });
    langButtons.forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
    document.addEventListener('keydown', e => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (drawer.open && e.key.toLowerCase() !== 'd' || mapDialog.open && e.key.toLowerCase() !== 'm') return;
      if (e.target.closest('input, textarea, select, [contenteditable]')) return;
      const key = e.key.toLowerCase();
      if (key === 'arrowright' || key === 'n' || key === 'pagedown') { e.preventDefault(); forward(); }
      else if (key === 'arrowleft' || key === 'pageup') { e.preventDefault(); backward(); }
      else if (key === 'r') resetSimulation();
      else if (key === 'd') drawer.open ? drawer.close() : openDocs();
      else if (key === 'l') setLang(state.lang === 'pl' ? 'en' : 'pl');
      else if (key === 'p') replayFlow();
      else if (key === 'm') mapDialog.open ? mapDialog.close() : openMap();
    });

    // ─── Init ───
    queryInput.value = state.query;
    applyStaticText();
    render();

    // ─── Reveal ───
    const FONT_WAIT_MS = 1500;
    const BRAND_FONTS = ['400 1em Outfit', '700 1em Outfit', '400 1em "IBM Plex Sans"', '600 1em "IBM Plex Sans"', '400 1em "Roboto Mono"'];
    Promise.race([
      Promise.all(BRAND_FONTS.map(f => document.fonts.load(f).catch(() => null))),
      new Promise(r => setTimeout(r, FONT_WAIT_MS)),
    ]).then(() => document.documentElement.classList.add('app-ready'));
  </script>
</body>
</html>
